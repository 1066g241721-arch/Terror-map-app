    html, body {

    }

    #map {

      height: 100vh;
    }

    /* 左上コントロールパネル */
    .map-ui {
      position: fixed;
      top: 15px;
      left: 60px;
      z-index: 1000;
      width: 320px;
      background: white;
      border-radius: 12px;
      box-shadow: 0 5px 20px rgba(0,0,0,0.25);
      overflow: hidden;
    }

    .map-title {
      padding: 14px;
      font-weight: bold;
      font-size: 18px;
      background: #222;
      color: white;
    }

    #searchBox {
      width: 100%;
      padding: 12px;
      border: none;
      border-bottom: 1px solid #ddd;
      outline: none;
      font-size: 14px;
    }

    /* カテゴリーフィルター */
    .filters {
      padding: 10px;
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }

    .filter-btn {
      border: none;
      padding: 7px 10px;
      border-radius: 20px;
      cursor: pointer;
      background: #eee;
      font-size: 12px;
      transition: 0.2s;
    }

    .filter-btn:hover {
      transform: translateY(-1px);
    }

    .filter-btn.active {
      background: #222;
      color: white;
    }

    /* 検索結果 */
    #searchResults {
      max-height: 220px;
      overflow-y: auto;
    }

    .search-item {
      padding: 12px;
      border-top: 1px solid #eee;
      cursor: pointer;
    }

    .search-item:hover {
      background: #f5f5f5;
    }

    .search-prefecture {
      margin-top: 4px;
      font-size: 12px;
      color: #777;
    }

    /* 詳細サイドパネル */
    #detailPanel {
      position: fixed;
      top: 0;
      right: -430px;
      width: 400px;
      height: 100vh;
      background: white;
      z-index: 2000;
      box-shadow: -5px 0 20px rgba(0,0,0,0.3);
      transition: right 0.3s ease;
      overflow-y: auto;
    }

    #detailPanel.open {
      right: 0;
    }

    #detailContent {
      padding: 25px;
    }

    #closePanel {
      position: sticky;
      top: 10px;
      float: right;
      border: none;
      background: #eee;
      border-radius: 50%;
      width: 38px;
      height: 38px;
      font-size: 24px;
      cursor: pointer;
    }

    .detail-title {
      margin-top: 45px;
      font-size: 24px;
      line-height: 1.4;
    }

    .detail-section {
      margin-top: 25px;
    }

    .detail-section h3 {
      border-left: 5px solid #222;
      padding-left: 10px;
    }

    .warning {
      padding: 15px;
      background: #fff0f0;
      border-radius: 10px;
    }

    .ghost-marker {
      font-size: 28px;
      text-align: center;
    }

    /* スマホ対応 */
    @media (max-width: 600px) {
      .map-ui {
        top: 10px;
        left: 10px;
        width: calc(100% - 20px);
      }

      #detailPanel {
        width: 100%;
        right: -100%;
      }

      #detailPanel.open {
        right: 0;
      }

      .map-title {
        font-size: 16px;
      }

      .filter-btn {
        font-size: 11px;
        padding: 6px 8px;
      }
    }

  // マーカークラスター設定
  const markers = L.markerClusterGroup({
    showCoverageOnHover: false,
    spiderfyOnMaxZoom: true,
    disableClusteringAtZoom: 15,
    maxClusterRadius: 50
  });

  const markerObjects = [];

  // スポット移動関数
  function flyToSpot(spot) {
    map.flyTo([spot.lat, spot.lng], 15, { duration: 1.2 });
  }

  // マーカーの生成
  spots.forEach(spot => {
    const emoji = icons[spot.category] || "👻";
    const markerIcon = L.divIcon({
      className: "ghost-marker",
      html: emoji,
      iconSize: [35, 35],
      iconAnchor: [17, 35]
    });

    const marker = L.marker([spot.lat, spot.lng], { icon: markerIcon });

    marker.on("click", () => {
      flyToSpot(spot);
      openDetail(spot);
    });

    markers.addLayer(marker);
    markerObjects.push({ spot, marker });
  });

  map.addLayer(markers);

  // 詳細パネルを開く
  function openDetail(spot) {
    const panel = document.getElementById("detailPanel");
    const content = document.getElementById("detailContent");

    content.innerHTML = `
      <button id="closePanel">×</button>
      <h1 class="detail-title">${escapeHTML(spot.name)}</h1>
      <p>📍 ${escapeHTML(spot.prefecture)}</p>
      <p>🏷 ${escapeHTML(spot.category)}</p>

      <div class="detail-section">
        <h3>📖 スポット概要</h3>
        <p style="white-space:pre-line;">${escapeHTML(spot.description)}</p>
      </div>

      <div class="detail-section">
        <h3>👻 噂される怪奇現象・噂</h3>
        <p style="white-space:pre-line;">${escapeHTML(spot.phenomena)}</p>
      </div>

      <div class="detail-section warning">
        <h3>⚠ 注意事項</h3>
        <p>${escapeHTML(spot.danger)}</p>
      </div>

      <div class="detail-section">
        <small>
          ※怪奇現象は科学的に確認された事実ではありません。<br>
          ※都市伝説・伝承・体験談として紹介しています。<br>
          ※私有地や立入禁止区域への無断侵入は禁止です。
        </small>
      </div>
    `;

    panel.classList.add("open");
    document.getElementById("closePanel").addEventListener("click", closeDetail);
  }

  // 詳細パネルを閉じる
  function closeDetail() {
    document.getElementById("detailPanel").classList.remove("open");
  }

  // Unicode表記で記号を指定するエスケープ処理
  function escapeHTML(str) {
    if (!str) return "";
    return String(str)
      .replace(/&/g, "&amp;")
      .replace(/\u003C/g, "&lt;")
      .replace(/\u003E/g, "&gt;")
      .replace(/"/g, "&quot;")
      .replace(/'/g, "&#39;");
  }

  // 検索機能
  const searchBox = document.getElementById("searchBox");
  searchBox.addEventListener("input", function() {
    const keyword = this.value.toLowerCase().trim();
    const results = document.getElementById("searchResults");
    results.innerHTML = "";

    if (!keyword) return;

    const filtered = spots.filter(spot => 
      spot.name.toLowerCase().includes(keyword) ||
      spot.prefecture.toLowerCase().includes(keyword) ||
      spot.category.toLowerCase().includes(keyword)
    );

    filtered.slice(0, 20).forEach(spot => {
      const item = document.createElement("div");
      item.className = "search-item";
      item.innerHTML = `
        <b>${escapeHTML(spot.name)}</b>
        <div class="search-prefecture">
          ${escapeHTML(spot.prefecture)} ・ ${escapeHTML(spot.category)}
        </div>
      `;

      item.addEventListener("click", () => {
        flyToSpot(spot);
        openDetail(spot);
        results.innerHTML = "";
        searchBox.value = "";
      });

      results.appendChild(item);
    });
  });

  // カテゴリーフィルター機能
  let activeCategory = "すべて";

  function updateMarkers() {
    markers.clearLayers();
    markerObjects.forEach(item => {
      if (activeCategory === "すべて" || item.spot.category === activeCategory) {
        markers.addLayer(item.marker);
      }
    });
  }

  document.querySelectorAll(".filter-btn").forEach(button => {
    button.addEventListener("click", function() {
      document.querySelectorAll(".filter-btn").forEach(btn => btn.classList.remove("active"));
      this.classList.add("active");
      activeCategory = this.dataset.category;
      updateMarkers();
    });
  });

  // ESCキーでパネルを閉じる
  document.addEventListener("keydown", event => {
    if (event.key === "Escape") {
      closeDetail();
    }
  });
</script>
